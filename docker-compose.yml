services:
  db:
    image: postgres:15
    container_name: voleybol-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: voleybol
      POSTGRES_USER: voleybol_user
      POSTGRES_PASSWORD: voleybol_pass
    volumes:
      - db-data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.7.0
    container_name: voleybol-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,DOCKER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data

  redis:
    image: redis:7-alpine
    container_name: voleybol-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: voleybol-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: voleybol-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9094
    depends_on:
      - kafka

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: voleybol-redis-commander
    ports:
      - "8091:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      - redis

volumes:
  db-data:
  kafka-data:
  redis-data: